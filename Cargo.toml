[workspace.package]
version = "0.1.0"
authors = ["Carl Boije <boijec@gmail.com>"]
edition = "2024"
publish = false
license = "MIT"

[workspace]
resolver = "3"
members = ["acme-client", "crates/*"]
default-members = ["crates/acme-sentry-bin"]

[workspace.dependencies]
acme-client = { path = "./acme-client" }
sentry-core = { path = "crates/sentry-core" }
sentry-api = { path = "crates/sentry-api" }
sentry-db = { path = "crates/sentry-db" }
sentry-io = { path = "crates/sentry-io" }
sentry-plugin-engine = { path = "crates/sentry-plugin-engine" }
sentry-job-engine = { path = "crates/sentry-job-engine" }
sentry-common = { path = "crates/sentry-common" }
sentry-crypto = { path = "crates/sentry-crypto" }
sentry-jose = { path = "crates/sentry-jose" }

acme-sentry-plugin-sdk-rs = { git = "https://github.com/boijec/acme-sentry-plugin-sdk-rs" }

async-trait = "0.1.92"
base64 = "0.23.1"
openssl = "0.10.81"
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
tokio = { version = "1.53.2", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
clap = { version = "4.6.7", features = ["derive", "cargo"] }
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["v4"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_yaml = "0.9.34"
actix-web = "4.15.0"