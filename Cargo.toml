[workspace.package]
version = "0.1.0"
authors = ["Carl F. G. Boije <boijec@gmail.com>"]
edition = "2024"
publish = false
license = "MIT"

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/acme-sentry-bin"]

[workspace.dependencies]
#Internal
sentry-core = { path = "crates/sentry-core" }
sentry-api = { path = "crates/sentry-api" }
sentry-db = { path = "crates/sentry-db" }
sentry-io = { path = "crates/sentry-io" }
sentry-plugin-engine = { path = "crates/sentry-plugin-engine" }
sentry-job-engine = { path = "crates/sentry-job-engine" }
sentry-common = { path = "crates/sentry-common" }
sentry-crypto = { path = "crates/sentry-crypto" }
sentry-jose = { path = "crates/sentry-jose" }
sentry-rfc8555 = { path = "crates/sentry-rfc8555" }

# Plugin SDK
acme-sentry-plugin-sdk-rs = { git = "https://github.com/boijec/acme-sentry-plugin-sdk-rs" }

# Parsing
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

#Runtime and Async
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt", "time"] }

#Http
actix-web = "4.20.0"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }

#Utils
base64 = "0.23.1"
openssl = "0.10.82"
clap = { version = "4.6.8", features = ["derive", "cargo"] }
uuid = { version = "1.29.3", features = ["v4"] }
tempfile = "3.27.0"
hex = "0.4.3"
chrono = "0.4.45"

#Error
anyhow = "1.0.104"
thiserror = "2.0.21"

#Database
sqlx = { version = "0.9.1", features = ["sqlite", "runtime-tokio"] }

#Tracing
tracing = "0.1.44"
tracing-subscriber = "0.3.23"