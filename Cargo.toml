[package]
name = "acme-sentry-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
acme-client = { path = "./acme-client" }
persistence = { path = "./persistence" }
common-utils = { path = "./common-utils" }
serde_json = "1.0.149"
async-trait = "0.1.92"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
tokio = { version = "1.53.2", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "cargo"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlite = "0.37.0"
serde_yaml = "0.9.34"
actix-web = "4.15.0"
acme-sentry-plugin-sdk-rs = { version = "0.1.0", path = "../acme-sentry-plugin-sdk-rs" }

[workspace]
resolver = "3"
members = ["acme-client", "common-utils", "persistence"]
